[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posture-guard"
version = "0.1.0"
description = "RealSense posture corrector with live verification dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    # Dashboard is part of the always-on runtime, not a hardware extra.
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",  # TestClient transport for the dashboard tests
]
# Heavy camera/pose deps are optional so CI and dev machines install fast.
# The RealSense and MediaPipe imports are lazy (inside camera.py / pose.py).
hardware = [
    "pyrealsense2>=2.56",
    "mediapipe>=0.10",
    "opencv-python>=4.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
