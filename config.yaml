# Posture Guard configuration. All durations in seconds, all angles in degrees.

camera:
  width: 640
  height: 480
  fps: 30

scoring:
  # A metric is "bad" when its absolute value passes the threshold.
  # Hysteresis: it only counts as "good" again once it falls back below
  # (threshold - hysteresis_margin_deg). The needle's green/amber/red bands
  # are anchored to these same exit/enter lines, so the gauge color always
  # agrees with the good/ok/bad zone (demo tuning: between the original
  # 12/6 + 3.0 and the over-tight 7/3.5 + 1.5 that trapped posture in neutral).
  head_forward_deg: 9.0
  trunk_lean_deg: 9.0
  head_tilt_deg: 9.0
  shoulder_level_deg: 5.0
  hysteresis_margin_deg: 2.0
  # MediaPipe landmark visibility floor: set to 0.0 for demos so hidden hips
  # or lighting variations never trigger UNRELIABLE.
  visibility_floor: 0.0
  # Set false to score ears/shoulders while hips are hidden (trunk lean then
  # reports unavailable and drops out). Whenever hips ARE visible the trunk
  # angle counts toward good/ok/bad either way, so trunk slouches still chime.
  trunk_lean_required: false
  # Depth gate: 0.0 to 10.0 disables depth gating so sitting distance never blocks scoring.
  depth_min_m: 0.0
  depth_max_m: 10.0

state:
  # Smoothing horizon: deliberately short so ANY real frame rate fills the
  # window (0.3 s needed 10+ fps; slower boxes then never started a bad
  # streak - red needle, 0% bar, no sound). Sustain durations still gate firing.
  smoothing_window_s: 0.1
  bad_sustain_s: 1.0          # chime after bad posture is confirmed 1.0 s
  good_confirm_s: 1.5         # hold good posture 1.5 s to confirm state GOOD
  recovery_good_s: 2.5        # hold good 2.5 s after a chime -> back to GOOD
  voice_delay_s: 2.0          # spoken prompt 2.0s after the chime
  voice_repeat_cooldown_s: 5.0  # minimum spacing between spoken prompts
  no_person_timeout_s: 2.0    # no pose / out of depth band this long -> NO_PERSON

audio:
  # PulseAudio/PipeWire sink name; null = first USB audio sink.
  sink: null
  # Spoken prompt wording (rendered by TTS; editable at runtime on the dashboard).
  voice_text: "Please fix your posture"
  positive_voice_text: "Good posture, keep it up!"

feedback:
  positive_chime:
    enabled: true        # reward sustained good posture with an upbeat chime
    every_seconds: 15    # fire at most this often while posture stays GOOD (demo pace)

