name: demo-video

# Records real footage of the deployed app with Playwright, then renders the
# Kiroween demo video with Remotion (video/). The app is self-hosted, so the
# recording needs only the site itself. The MP4 is uploaded as the
# "posture-guard-demo" artifact.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Site to record
        default: https://arii.github.io/posture-guard/
  push:
    paths:
      - "video/**"
      - "scripts/make-fake-camera.mjs"
      - ".github/workflows/demo-video.yml"

# Only superseded feature-branch pushes share a cancellation group.
# Main, manual, scheduled and tag runs stay independent, including pending runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: video
    env:
      BASE_URL: ${{ inputs.base || 'https://arii.github.io/posture-guard/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System packages (ffmpeg, espeak-ng, fonts)
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq ffmpeg espeak-ng fonts-dejavu-core
      - name: Install Remotion and Playwright
        timeout-minutes: 10
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Fake camera feed
        run: node ../scripts/make-fake-camera.mjs person.y4m --seconds 12 --tilt-after 5
      - name: Sounds
        run: bash scripts/make-audio.sh
      - name: Record footage from the live site
        timeout-minutes: 6
        run: node scripts/capture.mjs "$BASE_URL" "$PWD/person.y4m" public
      - name: Render with Remotion
        timeout-minutes: 25
        run: >
          npx remotion render src/index.ts PostureGuardDemo out/posture-guard-demo.mp4
          --props=public/capture.json --concurrency=2
      - name: Stills for review
        # One frame from each scene, plus a contact sheet, so the edit can be
        # reviewed without downloading the full video.
        run: |
          mkdir -p out/stills
          for t in 4 14 18.5 25.5 31 38 48.5 52 62 72 78.5 90 102 108; do
            ffmpeg -loglevel error -y -ss "$t" -i out/posture-guard-demo.mp4 -frames:v 1 \
              -vf scale=960:540 "out/stills/t$(printf '%05.1f' "$t").png"
          done
          ffmpeg -loglevel error -y -pattern_type glob -i 'out/stills/t*.png' \
            -vf "scale=480:270,tile=4x4:padding=6" -frames:v 1 out/stills/contact-sheet.png
          ls out/stills
      - name: Upload stills
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posture-guard-demo-stills
          path: video/out/stills/
          if-no-files-found: warn
      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posture-guard-demo
          path: |
            video/out/posture-guard-demo.mp4
            video/public/capture.json
            video/public/footage/*.webm
          if-no-files-found: warn
